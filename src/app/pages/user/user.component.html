<div class="kiosk-center-stage">
  <!-- Header -->
  <div class="hospital-kiosk-header">
    <div class="hospital-badge">
      STAFF & USER MANAGEMENT
    </div>
    <h1 class="hospital-kiosk-title">ระบบจัดการผู้ใช้งาน</h1>
    <p class="hospital-kiosk-subtitle">ลงทะเบียนเจ้าหน้าที่และจัดการสิทธิ์การเข้าถึง</p>
  </div>

  <!-- Cards Grid -->
  <div class="row w-100 justify-content-center g-4" style="max-width: 760px;">
    <!-- Option 1: ลงทะเบียน -->
    <div class="col-md-6 col-12 mb-3">
      <div class="hospital-card">
        <div class="hospital-card-icon-wrapper">
          <img src="assets/img/registered.gif" class="list" alt="ลงทะเบียน" />
        </div>
        <h2 class="hospital-card-title">ลงทะเบียน</h2>
        <p class="hospital-card-desc">เพิ่มข้อมูลเจ้าหน้าที่เข้าสู่ระบบ</p>
      </div>
    </div>

    <!-- Option 2: จัดการบัญชี -->
    <div class="col-md-6 col-12 mb-3">
      <div class="hospital-card">
        <div class="hospital-card-icon-wrapper">
          <img src="assets/img/user-setup.gif" class="list" alt="จัดการบัญชี" />
        </div>
        <h2 class="hospital-card-title">จัดการบัญชี</h2>
        <p class="hospital-card-desc">แก้ไขข้อมูลและกำหนดสิทธิ์ผู้ใช้</p>
      </div>
    </div>
  </div>
</div>
